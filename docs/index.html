<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ตารางสอน โรงเรียนทหารขนส่ง</title><link rel="stylesheet" href="style.css"><body><header><span>โรงเรียนทหารขนส่ง</span><h1>ตารางสอนสำหรับครู</h1><p id="updated">กำลังโหลดข้อมูล…</p></header><main><section class="filters"><label>หลักสูตร<select id="course"></select></label><label>ตั้งแต่วันที่<input id="from" type="date"></label><label>ถึงวันที่<input id="to" type="date"></label><label>ค้นหาวิชา / ผู้สอน / สถานที่<input id="search" type="search" placeholder="พิมพ์คำค้นหา"></label><button id="reset">ล้างตัวกรอง</button><button id="print">พิมพ์ / บันทึก PDF</button></section><h2 id="title"></h2><p id="status" role="status"></p><div class="table-wrap"><table><thead><tr><th>วันที่</th><th>เวลา</th><th>วิชา / กิจกรรม</th><th>ผู้สอน</th><th>สถานที่</th><th>การแต่งกาย</th></tr></thead><tbody id="rows"></tbody></table></div><footer>ข้อมูลตารางสอนที่ผู้ดูแลเผยแพร่ • ติดต่อผู้ดูแลหากต้องการแก้ไขตาราง</footer></main><script src="app.js"></script></body></html>
